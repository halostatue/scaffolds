{{- /*
  .vale.ini. The host file uses #[[[ ]]] delimiters, but partials are always
  parsed with {{ }}.

  Knobs: .Computed.valeFormats (comma list of source extensions linted as
  Markdown), .Computed.valeGrammars, .Computed.githubActions.
*/ -}}
{{- $formats := splitList "," .Computed.valeFormats -}}
StylesPath = .config/styles
MinAlertLevel = suggestion
Vocab = {{ .ProjectKebab }}
Grammars = {{ .Computed.valeGrammars }}

[formats]
{{ range $formats }}{{ . }} = md
{{ end -}}
yaml = md
yml = md

[*.md]
BasedOnStyles = Vale

[*.{{ if gt (len $formats) 1 }}{ {{- join "," $formats -}} }{{ else }}{{ first $formats }}{{ end }}]
BasedOnStyles = Vale
{{- if .Computed.githubActions }}

[.github/workflows/*.{yml,yaml}]
BasedOnStyles = Vale
View = GHA
{{- end }}
