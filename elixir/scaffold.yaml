# yaml-language-server: $schema=https://hay-kot.github.io/scaffold/schema.json
messages:
  pre: |
    # Elixir Project Scaffold

    Generate a new Elixir project with standard tooling and structure.

  post: |
    # Get Started

    ```sh
    cd {{ .ProjectSnake }}
    mix test
    ```

presets:
  default:
    elixirVersion: "18"

  tableau:
    elixirVersion: "18"

  test:
    description: "Test elixir scaffold"
    githubOwner: "test-owner"
    authorName: "Test Author"
    elixirVersion: "18"
    licenceId: "Apache-2.0"

questions:
  - name: "description"
    group: "project"
    prompt:
      message: "Project description"
      multi: true
    required: true

  - name: "githubOwner"
    group: "project"
    prompt:
      message: "GitHub owner (user or org)"
    required: true

  - name: "authorName"
    group: "project"
    prompt:
      message: "Author/Maintainer name (optional, defaults to GitHub owner)"

  - name: "maintainerVoice"
    group: "project"
    prompt:
      message: "Maintainer voice in documentation (I/me/my or we/us/our)"
      default: "singular"
      options:
        - "singular"
        - "plural"

  - name: "elixirVersion"
    group: "project"
    prompt:
      message: "Minimum Elixir minor version (integer, e.g. 18 for ~> 1.18)"
      default: "18"

  - name: "includeAIPolicy"
    group: "project"
    prompt:
      confirm: "Include AI Policy?"
      default: true

  - name: "licenceId"
    group: "licence"
    prompt:
      message: "License"
      default: "Apache-2.0"
      options:
        - "Apache-2.0"
        - "MIT"
        - "Apache-2.0 and MIT"

  - name: "useGitHubActions"
    group: "ci"
    prompt:
      confirm: "Enable GitHub Actions?"
      default: true

  - name: "useDependabot"
    group: "ci"
    prompt:
      confirm: "Enable Dependabot?"
      default: true

  - name: "useCoveralls"
    group: "ci"
    prompt:
      confirm: "Use Coveralls?"
      default: true

  - name: "useGitHubFunding"
    group: "project"
    prompt:
      confirm: "Enable GitHub Funding?"
      default: true

computed:
  projectName: "`{{ .ProjectSnake }}`"
  author: "{{ or .Scaffold.authorName .Scaffold.githubOwner }}"
  elixirVersion: "~> 1.{{ .Scaffold.elixirVersion }}"
  githubRepoName: "{{ .Scaffold.githubOwner }}/{{ .ProjectSnake }}"
  githubUrl: "https://github.com/{{ .Scaffold.githubOwner }}/{{ .ProjectSnake }}"
  hasApache: '{{ or (eq .Scaffold.licenceId "Apache-2.0") (eq .Scaffold.licenceId "Apache-2.0 and MIT") }}'
  hasMit: '{{ or (eq .Scaffold.licenceId "MIT") (eq .Scaffold.licenceId "Apache-2.0 and MIT") }}'
  isDual: '{{ eq .Scaffold.licenceId "Apache-2.0 and MIT" }}'
  # Knobs for shared partials (see the header comment of each partial).
  dependabotEcosystems: "mix:mix"
  depSubmission: "mix"
  githubActions: "{{ .Scaffold.useGitHubActions }}"
  ignoreDirs: "deps,_build,doc,.elixir_ls,.elixir-tools,test/support/fixtures"
  valeFormats: "ex,exs"
  valeGrammars: '{{ "elixir,yaml" | splitList "," | join ", " }}'
  year: '{{ now | date "2006" }}'
  # Maintainer voice: single-word substitutions; use `if .Computed.plural`
  # inline for anything longer.
  plural: '{{ eq .Scaffold.maintainerVoice "plural" }}'
  We: '{{ if eq .Scaffold.maintainerVoice "plural" }}We{{ else }}I{{ end }}'
  we: '{{ if eq .Scaffold.maintainerVoice "plural" }}we{{ else }}I{{ end }}'
  our: '{{ if eq .Scaffold.maintainerVoice "plural" }}our{{ else }}my{{ end }}'

features:
  - value: "{{ .Scaffold.useGitHubActions }}"
    globs:
      - "**/.github/dco-check.toml"
      - "**/.github/workflows/**"
      - "**/.github/zizmor.yml"

  - value: "{{ .Scaffold.useDependabot }}"
    globs:
      - "**/.github/dependabot.yml"

  - value: "{{ .Computed.hasApache }}"
    globs:
      - "**/licences/APACHE-2.0.txt"

  - value: "{{ .Computed.hasMit }}"
    globs:
      - "**/licences/MIT.txt"

  - value: "{{ .Scaffold.useGitHubFunding }}"
    globs:
      - "**/.github/FUNDING.yml"

  - value: "{{ .Scaffold.includeAIPolicy }}"
    globs:
      - "**/AI_POLICY.md"

delimiters:
  - glob: "**/.github/workflows/**"
    left: "#[[["
    right: "]]]"

  - glob: ".vale.ini"
    left: "#[[["
    right: "]]]"

  - glob: "mise.toml"
    left: "#[[["
    right: "]]]"

  - glob: ".gitignore"
    left: "#{{"
    right: "}}"
