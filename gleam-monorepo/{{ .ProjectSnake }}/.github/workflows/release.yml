name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to hex.pm

    runs-on: ubuntu-latest

    environment: release

    permissions:
      id-token: write # Required for workload identities
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            builds.hex.pm:443
            coveralls.io:443
            github.com:443
            hex.pm:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '#[[[ .Computed.gleamCurrMinor ]]]'
          rebar3-version: "3"

      - name: Publish Package
        run: |
          gleam deps download
          gleam publish --yes
