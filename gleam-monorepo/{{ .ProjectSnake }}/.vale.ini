StylesPath = .config/styles
MinAlertLevel = suggestion
Vocab = #[[[ .ProjectKebab ]]]
Grammars = #[[[ .Computed.valeGrammars ]]]

[formats]
erl = md
gleam = md
mjs = md
yaml = md
yml = md

[*.md]
BasedOnStyles = Vale

[*.erl]
BasedOnStyles = Vale

[*.gleam]
BasedOnStyles = Vale

[*.mjs]
BasedOnStyles = Vale
#[[[- if .Scaffold.useGitHubActions ]]]

[.github/workflows/*.{yml,yaml}]
BasedOnStyles = Vale
View = GHA
#[[[- end ]]]
