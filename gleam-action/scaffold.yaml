# yaml-language-server: $schema=https://hay-kot.github.io/scaffold/schema.json
messages:
  pre: |
    # Gleam GitHub Action Scaffold

    Generate a new Gleam-based GitHub Action with separated core/action entry points.

  post: |
    # Get Started

    ```sh
    cd {{ .ProjectSnake }}
    mise run test
    mise run build
    ```

presets:
  default:
    gleamMinorVersion: "19"

  test:
    description: "Test gleam-action scaffold"
    githubOwner: "test-owner"
    authorName: "Test Author"
    gleamMinorVersion: "19"
    actionIcon: "check-circle"
    actionColor: "blue"
    licenceId: "Apache-2.0"

questions:
  - name: "description"
    group: "project"
    prompt:
      message: "Project description"
      multi: true
    required: true

  - name: "githubOwner"
    group: "project"
    prompt:
      message: "GitHub owner (user or org)"
    required: true

  - name: "authorName"
    group: "project"
    prompt:
      message: "Author/Maintainer name (optional, defaults to GitHub owner)"

  - name: "maintainerVoice"
    group: "project"
    prompt:
      message: "Maintainer voice in documentation (I/me/my or we/us/our)"
      default: "singular"
      options:
        - "singular"
        - "plural"

  - name: "gleamMinorVersion"
    group: "project"
    prompt:
      message: "Gleam minor version (integer, e.g. 15 for 1.15)"
      default: "19"

  - name: "includeAIPolicy"
    group: "project"
    prompt:
      confirm: "Include AI Policy?"
      default: true

  - name: "actionIcon"
    group: "action"
    prompt:
      message: "Action branding icon (feather icon name)"
      default: "check-circle"

  - name: "actionColor"
    group: "action"
    prompt:
      message: "Action branding color"
      default: "blue"
      options:
        - "white"
        - "yellow"
        - "blue"
        - "green"
        - "orange"
        - "red"
        - "purple"
        - "gray-dark"

  - name: "licenceId"
    group: "licence"
    prompt:
      message: "License"
      default: "Apache-2.0"
      options:
        - "Apache-2.0"
        - "MIT"
        - "Apache-2.0 and MIT"

  - name: "useGitHubFunding"
    group: "project"
    prompt:
      confirm: "Enable GitHub Funding?"
      default: true

computed:
  projectName: "{{ .Scaffold.githubOwner }}/{{ .ProjectSnake }}"
  author: '{{ or .Scaffold.authorName .Scaffold.githubOwner }}'
  githubRepoName: '{{ .Scaffold.githubOwner }}/{{ .ProjectSnake }}'
  githubUrl: 'https://github.com/{{.Scaffold.githubOwner }}/{{ .ProjectSnake }}'
  gleamMinVersion: '1.{{ .Scaffold.gleamMinorVersion | toInt | add -1 }}.0'
  gleamMiseVersion: '1.{{ .Scaffold.gleamMinorVersion }}'
  hasApache: '{{ or (eq .Scaffold.licenceId "Apache-2.0") (eq .Scaffold.licenceId "Apache-2.0 and MIT") }}'
  hasMit: '{{ or (eq .Scaffold.licenceId "MIT") (eq .Scaffold.licenceId "Apache-2.0 and MIT") }}'
  isDual: '{{ eq .Scaffold.licenceId "Apache-2.0 and MIT" }}'
  licenceShield: >
   {{- if eq .Scaffold.licenceId "Apache-2.0 and MIT" -}}
   Apache--2.0%20AND%20MIT
   {{- else if eq .Scaffold.licenceId "Apache-2.0" -}}
   Apache--2.0
   {{- else -}}
   MIT
   {{- end -}}
  # Knobs for shared partials (see the header comment of each partial).
  # An action always has GitHub Actions, so there is no question for it.
  githubActions: "true"
  ignoreDirs: "build,dist"
  valeFormats: "gleam,mjs"
  # Gleam isn't yet supported by vale
  valeGrammars: '{{ "javascript,yaml" | splitList "," | join ", " }}'
  year: '{{ now | date "2006" }}'
  # Maintainer voice: single-word substitutions; use `if .Computed.plural`
  # inline for anything longer.
  plural: '{{ eq .Scaffold.maintainerVoice "plural" }}'
  We: '{{ if eq .Scaffold.maintainerVoice "plural" }}We{{ else }}I{{ end }}'
  we: '{{ if eq .Scaffold.maintainerVoice "plural" }}we{{ else }}I{{ end }}'
  our: '{{ if eq .Scaffold.maintainerVoice "plural" }}our{{ else }}my{{ end }}'

features:
  - value: "{{ .Computed.hasApache }}"
    globs:
      - "**/licences/APACHE-2.0.txt"

  - value: "{{ .Computed.hasMit }}"
    globs:
      - "**/licences/MIT.txt"

  - value: "{{ .Scaffold.useGitHubFunding }}"
    globs:
      - "**/.github/FUNDING.yml"

  - value: "{{ .Scaffold.includeAIPolicy }}"
    globs:
      - "**/AI_POLICY.md"

delimiters:
  - glob: "**/.github/workflows/**"
    left: "#[[["
    right: "]]]"

  - glob: ".vale.ini"
    left: "#[[["
    right: "]]]"

  - glob: "**/action.yml"
    left: "#[[["
    right: "]]]"

  - glob: "mise.toml"
    left: "#[[["
    right: "]]]"
