name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            os: ubuntu-24.04
            check_fmt: true
            clippy: true
          - rust: beta
            os: ubuntu-24.04
          - rust: nightly
            os: ubuntu-24.04
          - rust: '#[[[ .Scaffold.msrv ]]]'
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            crates.io:443
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        env:
          RUST: ${{ matrix.rust }}
          CHECK_FMT: ${{ matrix.check_fmt }}
          CLIPPY: ${{ matrix.clippy }}
        run: |
          args=(--profile minimal --no-self-update)
          [[ $CHECK_FMT == true ]] && args+=(--component rustfmt)
          [[ $CLIPPY == true ]] && args+=(--component clippy)
          rustup toolchain install "$RUST" "${args[@]}"
          rustup default "$RUST"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --check
        if: matrix.check_fmt

      - run: cargo clippy --all-targets --all-features -- -D warnings
        if: matrix.clippy

      - run: cargo build --all-targets --all-features

      - run: cargo test --all-features
