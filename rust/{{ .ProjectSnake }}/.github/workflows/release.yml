name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - run: rustup default stable-"${TARGET}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target "${env:TARGET}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/"${TARGET}"/release
          tar czf "#[[[ .ProjectSnake ]]]-${TARGET}.tar.gz" "#[[[ .ProjectSnake ]]]"
          mv "#[[[ .ProjectSnake ]]]-${TARGET}.tar.gz" "${WORKSPACE}"
        env:
          TARGET: ${{ matrix.target }}
          WORKSPACE: ${{ github.workspace }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${env:TARGET}/release
          7z a "#[[[ .ProjectSnake ]]]-${env:TARGET}.zip" "#[[[ .ProjectSnake ]]].exe"
          move "#[[[ .ProjectSnake ]]]-${env:TARGET}.zip" "${env:WORKSPACE}"
        env:
          TARGET: ${{ matrix.target }}
          WORKSPACE: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '#[[[ .ProjectSnake ]]]-${{ matrix.target }}'
          path: |
            #[[[ .ProjectSnake ]]]-${{ matrix.target }}.tar.gz
            #[[[ .ProjectSnake ]]]-${{ matrix.target }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: write # Publish the release

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "${TAG}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --verify-tag \
            --title "${TAG}"
