StylesPath = .config/styles
MinAlertLevel = suggestion
Vocab = #[[[ .ProjectKebab ]]]
Grammars = #[[[ .Computed.valeGrammars ]]]

[formats]
ex = md
exs = md
mjs = md
erl = md
yml = md
yaml = md

[*.md]
BasedOnStyles = Vale

[*.erl]
BasedOnStyles = Vale

[*.gleam]
BasedOnStyles = Vale

[*.mjs]
BasedOnStyles = Vale
#[[[- if .Scaffold.useGitHubActions ]]]

[.github/workflows/*.{yml,yaml}]
BasedOnStyles = Vale
View = GHA
#[[[- end ]]]
