name: Gleam verify

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-beam:
    name: Gleam ${{ matrix.gleam }} OTP ${{ matrix.otp }}

    strategy:
      fail-fast: false
      matrix:
        gleam:
          - '#[[[ .Computed.gleamPrevMinor ]]]'
          - '#[[[ .Computed.gleamCurrMinor ]]]'
        otp:
          - 27
          - 28
          - 29
        include:
          - gleam: '#[[[ .Computed.gleamCurrMinor ]]]'
            otp: 28
            quality: true

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            builds.hex.pm:443
            github.com:443
            hex.pm:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: builds@gleam-${{ steps.beam.outputs.gleam-version }}-otp-${{ steps.beam.outputs.otp-version }}-hash-${{ hashFiles('**/manifest.toml') }}
          path: |
            **/build

      - run: gleam deps download
      - run: gleam build --warnings-as-errors
      - run: gleam test --target erlang

      - name: Format check
        if: matrix.quality
        run: gleam format --check src test

      - name: Lint
        if: matrix.quality
        run: gleam run -m glinter

  test-bun:
    name: Gleam ${{ matrix.gleam }} OTP ${{ matrix.otp }} / Bun ${{ matrix.bun }}

    strategy:
      fail-fast: false
      matrix:
        gleam:
          - '#[[[ .Computed.gleamPrevMinor ]]]'
          - '#[[[ .Computed.gleamCurrMinor ]]]'
        otp:
          - 28
        bun:
          - latest

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            builds.hex.pm:443
            github.com:443
            hex.pm:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: bun
        with:
          bun-version: ${{ matrix.bun }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: builds@gleam-${{ steps.beam.outputs.gleam-version }}-otp-${{ steps.beam.outputs.otp-version }}-bun-${{ steps.bun.outputs.bun-version }}-hash-${{ hashFiles('**/manifest.toml') }}
          path: |
            **/build

      - run: gleam deps download
      - run: gleam test --target javascript --runtime bun

  test-deno:
    name: Gleam ${{ matrix.gleam }} OTP ${{ matrix.otp }} / Deno ${{ matrix.deno }}

    strategy:
      fail-fast: false
      matrix:
        gleam:
          - '#[[[ .Computed.gleamPrevMinor ]]]'
          - '#[[[ .Computed.gleamCurrMinor ]]]'
        otp:
          - 28
        deno:
          - v2.x

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            builds.hex.pm:443
            deno.com:443
            github.com:443
            hex.pm:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        id: deno
        with:
          deno-version: ${{ matrix.deno }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: builds@gleam-${{ steps.beam.outputs.gleam-version }}-otp-${{ steps.beam.outputs.otp-version }}-deno-${{ steps.deno.outputs.deno-version }}-hash-${{ hashFiles('**/manifest.toml') }}
          path: |
            **/build

      - run: gleam deps download
      - run: gleam test --target javascript --runtime deno

  test-node:
    name: Gleam ${{ matrix.gleam }} OTP ${{ matrix.otp }} / Node ${{ matrix.node }}

    strategy:
      fail-fast: false
      matrix:
        gleam:
          - '#[[[ .Computed.gleamPrevMinor ]]]'
          - '#[[[ .Computed.gleamCurrMinor ]]]'
        otp:
          - 28
        node:
          - 24.x
          - 26.x

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            builds.hex.pm:443
            github.com:443
            hex.pm:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: builds@gleam-${{ steps.beam.outputs.gleam-version }}-otp-${{ steps.beam.outputs.otp-version }}-node-${{ steps.node.outputs.node-version }}-hash-${{ hashFiles('**/manifest.toml') }}
          path: |
            **/build

      - run: gleam deps download
      - run: gleam test --target javascript --runtime node
