name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: '#[[[ .Scaffold.goVersionMin ]]]'
            os: ubuntu-24.04
          - go-version: '#[[[ .Scaffold.goVersion ]]]'
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}

    env:
      GOTOOLCHAIN: local

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            vuln.go.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - run: go test -race ./...

      - run: go build ./...

      - name: Cross-compile release targets
        run: |
          for os in darwin freebsd linux openbsd; do
            for arch in amd64 arm64; do
              echo "==> ${os}/${arch}"
              GOOS="${os}" GOARCH="${arch}" go build ./...
            done
          done

  quality:
    name: Quality
    runs-on: ubuntu-24.04

    env:
      GOTOOLCHAIN: local

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            mise.jdx.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            vuln.go.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - run: go mod download

      - name: Check formatting
        run: |
          files=("$(gofumpt -l .)")
          if ((${#files})); then
            echo >&2 "Unformatted files:"
            printf >&2 "  %s\n" "${files[@]}"
            exit 1
          fi

      - run: go vet ./...

      - run: golangci-lint run

      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
